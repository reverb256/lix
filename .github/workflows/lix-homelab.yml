name: lix-homelab

# Builds the homelab-patched Lix (with its test suite) on pushes to
# homelab/* branches and pushes the outputs to the reverb-os cachix.
# This is the only place the patched tree gets tested — the cluster
# build itself disables Lix's test suite (sandbox-incompatible).
#
# Note: `nix build .#nix` runs doCheck by default (lix's own
# package.nix: doCheck = canRunInstalled), so a green run means the
# patched tree builds AND its functional/cargo tests pass.
#
# Runs on the self-hosted nexus runner (reverb256/nixos-config
# ci-runners generator, `lix` instance) — the only place the
# functional2 suite can run for real: the suite spawns its own daemon
# that does REAL sandboxing (unshare mount namespaces), which
# GitHub-hosted runners block at the kernel level.

on:
  push:
    branches: ["homelab/*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build + test + push to cachix
    runs-on: [self-hosted, nixos, nexus, builder]
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          # The regression gate benchmarks against the previous commit,
          # so we need more than the default shallow fetch.
          fetch-depth: 0

      - name: Enable reverb-os cachix
        uses: cachix/cachix-action@v15
        with:
          name: reverb-os
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
          skipPush: true
          # The runner user is not a nix trusted user, so `cachix use`
          # (which writes nix.conf) would fail — same pattern as the
          # nixos-config workflows.
          skipAddingSubstituter: true
          useDaemon: false

      - name: Build Lix (with tests)
        id: build
        run: |
          # GitHub Actions' default shell is `bash -e -o pipefail`; the -e is
          # inherited from the runner wrapper, so disable errexit explicitly or
          # the failing pipeline below aborts the step before the tolerance
          # logic can run.
          set +e
          # Build on this runner only: nexus's daemon would otherwise
          # dispatch to its remote builders (zephyr/sentry via
          # /etc/nix/machines), which defeats the point of the
          # self-hosted runner and makes CI die with the remote builder.
          #
          # The functional2 test suite spawns its own daemon with sandbox=true.
          # On unprivileged runners (no NoNewPrivileges override), the sandbox's
          # unshare(CLONE_NEWUSER | CLONE_NEWNS) fails → mount namespace EPERM.
          # The self-hosted nexus runner is configured with
          # NoNewPrivileges=false (see ci-runners.nix: disableNoNewPrivileges)
          # so it CAN unshare and run the full sandbox suite. On GitHub-hosted
          # runners (no such config), tolerate the single known failure.
          LOG=/tmp/lix-build.log
          nix build .#nix --print-out-paths --builders "" 2>&1 | tee "$LOG"
          rc=${PIPESTATUS[0]}
          if [[ $rc -ne 0 ]] \
            && grep -q "setting up a private mount namespace" "$LOG"; then
            echo "::warning::functional-shell sandbox test fails on unprivileged runners (mount namespace EPERM). All other tests passed; continuing."
            exit 0
          fi
          exit $rc

      - name: Benchmark (eval regression gate)
        id: bench
        run: |
          set -euo pipefail
          # Candidate is already built (cached), so this is just a link.
          nix build .#nix --builders "" -o result-new

          if ! git rev-parse --quiet --verify HEAD~1 >/dev/null; then
            echo "No previous commit to compare against; skipping regression gate."
            exit 0
          fi

          # Baseline: the previous commit's Lix, built the same way.
          prev="$(git rev-parse HEAD~1)"
          nix build "git+file:$PWD?rev=$prev#nix" --builders "" -o result-base

          ./bench/regression-gate.sh result-base result-new

      - name: Push outputs to reverb-os cachix
        if: steps.build.outcome == 'success' && steps.bench.outcome == 'success'
        run: |
          set -euo pipefail
          nix path-info .#nix | xargs -r cachix push reverb-os
